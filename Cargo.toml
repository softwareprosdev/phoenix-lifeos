[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/core",
    "crates/shared",
    "crates/db",
    "crates/security",
    "crates/settings",
    "crates/finance",
    "crates/budgeting",
    "crates/debt",
    "crates/credit",
    "crates/investments",
    "crates/ai",
    "crates/vault",
    "crates/crm",
    "crates/sync",
    "crates/reports",
    "crates/automation",
]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "uuid", "chrono", "rust_decimal"] }

# Cryptography
argon2 = "0.5"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"

# Misc
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
