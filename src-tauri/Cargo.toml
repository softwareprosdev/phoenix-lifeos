[package]
name = "phoenix-lifeos"
version = "0.1.0"
edition = "2021"
description = "Phoenix LifeOS — Personal Financial & Life Operating System"

[lib]
name = "phoenix_lifeos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
rand = { workspace = true }

# Internal crates
phoenix-core = { path = "../crates/core" }
phoenix-db = { path = "../crates/db" }
phoenix-security = { path = "../crates/security" }
phoenix-settings = { path = "../crates/settings" }
phoenix-finance = { path = "../crates/finance" }
phoenix-budgeting = { path = "../crates/budgeting" }
phoenix-debt = { path = "../crates/debt" }
phoenix-credit = { path = "../crates/credit" }
phoenix-investments = { path = "../crates/investments" }
phoenix-vault = { path = "../crates/vault" }
phoenix-crm = { path = "../crates/crm" }
phoenix-reports = { path = "../crates/reports" }
phoenix-sync = { path = "../crates/sync" }
phoenix-automation = { path = "../crates/automation" }
phoenix-shared = { path = "../crates/shared" }
